# Para VPS que já tem nginx: copie para /etc/nginx/sites-available/automacao-instagram,
# ajuste o server_name, ative e rode: certbot --nginx -d <dominio>
server {
    listen 80;
    listen [::]:80;
    server_name insta.169-58-37-26.sslip.io;

    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
