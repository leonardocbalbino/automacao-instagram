services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: automacao
      POSTGRES_USER: automacao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automacao"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://automacao:${POSTGRES_PASSWORD}@postgres:5432/automacao
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /data/uploads
    ports:
      # só localhost: o HTTPS fica com o Caddy (profile caddy) ou com um nginx já existente
      - "${API_BIND:-127.0.0.1:3310}:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "src/workers/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://automacao:${POSTGRES_PASSWORD}@postgres:5432/automacao
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      - api

  # VPS dedicada: docker compose --profile caddy up -d (o Caddy emite o HTTPS sozinho)
  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
